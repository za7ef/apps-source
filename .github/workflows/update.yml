name: تحديث المصدر

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [new-release]
  push:
    paths:
      - apps.json
      - scripts/generate.py

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: توليد ملف المصدر
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate.py
      - name: حفظ التغييرات
        run: |
          if git diff --quiet source.json; then
            echo "لا توجد تغييرات."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "تحديث ملف المصدر بآخر الإصدارات"
          git pull --rebase
          git push
